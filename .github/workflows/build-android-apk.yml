
name: Build CA Hub Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build CA Hub APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract CA Hub ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f remix-ca-hub.zip || {
            echo "ERROR: remix-ca-hub.zip not found in repository root."
            exit 1
          }

          mkdir -p app-source
          unzip -q remix-ca-hub.zip -d app-source

          test -f app-source/package.json || {
            echo "ERROR: package.json not found."
            exit 1
          }

          test -f app-source/capacitor.config.json || {
            echo "ERROR: capacitor.config.json not found."
            exit 1
          }

      - name: Install dependencies
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps

          npm install --no-save --legacy-peer-deps \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      - name: Build web application
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          npm run build

          test -f dist/index.html || {
            echo "ERROR: dist/index.html not found."
            exit 1
          }

      - name: Initialize or sync Android project
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build debug APK
        working-directory: app-source/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CA Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: CA-Hub-Android-APK
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
